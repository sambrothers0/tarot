[package]
name = "tarot-scanner"
version = "0.1.0"
edition = "2021"
description = "Minecraft region-file block scanner, compiled to WebAssembly"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
# Pure-Rust inflate (miniz_oxide). Deliberately NOT the C `zlib`/`libdeflater`
# backends: those need a C toolchain and do not build for
# wasm32-unknown-unknown out of the box.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[profile.release]
# The scan is the whole product, so trade compile time for speed. `lto = "fat"`
# lets the inflate loop inline across crate boundaries; `opt-level = 3` (not
# "s") because a few extra KB of wasm is nothing against a 1.2 GB scan.
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
