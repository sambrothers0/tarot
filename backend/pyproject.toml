[project]
name = "tarot-backend"
version = "0.1.0"
description = "Accounts API for Tarot: Google sign-in and session management."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "google-auth>=2.30",
    "requests>=2.32",
    "pydantic-settings>=2.7",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
