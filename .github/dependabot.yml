# Weekly dependency PRs. CI must pass before any of them can land.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      dev-tooling:
        dependency-type: development
  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: weekly }
  - package-ecosystem: cargo
    directory: /scanner
    schedule: { interval: weekly }
  - package-ecosystem: pip
    directory: /infra/billing-killswitch
    schedule: { interval: weekly }
