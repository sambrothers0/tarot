name: Deploy to GitHub Pages

# Builds the Rust scanner to WebAssembly, then the Vite frontend, and publishes
# frontend/dist to GitHub Pages — but only once CI (ci.yml) has passed for a
# push to master, so a red commit never reaches the site. CI has no path filter,
# so every green push to master redeploys; an unchanged site redeploys as-is.
# The whole app is static: the scan runs in the visitor's browser. The optional
# accounts API (backend/) is deployed separately on Cloud Run; point the build at it
# with the repo variables VITE_API_URL and VITE_GOOGLE_CLIENT_ID (unset = no
# sign-in UI). One-time setup is required:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  # Manual deploys skip the CI gate.
  workflow_dispatch: {}

# Allow the deploy job to mint an OIDC token and publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deploys at once; let an in-flight run finish.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Pinned so a wasm-pack release can't change the build under us. Bump
  # deliberately.
  WASM_PACK_VERSION: v0.15.0

jobs:
  build:
    # Only a green CI run for a push (not a PR) to master deploys.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      # Deploy the exact commit CI tested, not whatever master is now.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # ubuntu-latest ships rustup with a stable toolchain, so only the wasm
      # target needs adding.
      - name: Add the wasm target
        run: rustup target add wasm32-unknown-unknown

      # Registry + build artifacts. Keyed on Cargo.lock so a dependency bump
      # invalidates it, with a looser prefix so an unrelated bump still gets a
      # warm-ish start.
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            scanner/target
          key: cargo-${{ runner.os }}-${{ hashFiles('scanner/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # Prebuilt binary rather than `cargo install wasm-pack`, which would spend
      # several minutes compiling a build tool on every cold cache.
      - name: Install wasm-pack
        run: |
          curl -sSfL "https://github.com/wasm-bindgen/wasm-pack/releases/download/${WASM_PACK_VERSION}/wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz --strip-components=1 -C /usr/local/bin --wildcards '*/wasm-pack'
          wasm-pack --version

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # `npm run build` runs `build:wasm` (wasm-pack) before tsc + vite, because
      # the TypeScript build needs the generated bindings to exist.
      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          # Project site lives under /tarot/ — must match the repo name.
          VITE_BASE: /tarot/
          # Optional; both public values. Unset hides the account UI.
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
